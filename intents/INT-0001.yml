uid: INT-0001
type: intent
status: approved
title: A tenant can read and act on a rent-arrears web page
text: 'The council publishes a page telling a tenant who has fallen into rent arrears
  how much is owed and how to pay or get help. A tenant must be able to understand it on
  first reading, the page must follow the council''s British-English house style, it must
  read in the council''s formal register, it must do its job of instructing the tenant,
  and it must be pitched at a lay reader with no housing-finance knowledge. Because it is
  published on the web rather than posted, it must also be shaped for the web channel —
  opening with a search-friendly title rather than an address block or salutation, broken
  into scannable headed sections, offering one clear online action to pay, and carrying
  no sign-off. Being readable, being correctly styled, being in the right register,
  serving the right purpose, being pitched at the right reader and being shaped for the
  channel are independent goals, so the page adopts a readability standard, a conventions
  standard, a tone standard, a purpose standard, an audience standard and a medium
  standard.'
normative: false
